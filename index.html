<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
</head>
<body>
<title>프랑스 한글학교 로비</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 화면 전체가 지도 한 장. 그 위에 작은 안내판: 왼쪽 위 제목, 오른쪽 위 버튼, 아래 가운데 카드, 왼쪽 아래 조이스틱.
   한낮의 지도 한 가지 모습으로만 만든다(어두운 화면 없음). 청·백·홍은 프랑스와 한국 국기가 함께 쓰는 색이다.
   교실(학교 공간)의 책·사진첩·TV·대화는 HTML 팝업(.pop, .talk)으로 보여 준다. */
:root{
  --ink:#1E2B4A; --ink-2:#4A5874; --paper:#FFFFFF; --glass:rgba(255,255,255,.9); --soft:#F1F5FB;
  --blue:#2A4D9B; --red:#E0483E; --green:#2F8F5B; --sky:#CDEBF6; --cream:#FFF9EC;
  --font-display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --shadow:0 6px 18px rgba(30,43,74,.16);
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;z-index:5}
.chipwrap{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;max-width:52vw}
.chip{pointer-events:auto;background:var(--glass);border-radius:16px;padding:8px 14px 9px;box-shadow:var(--shadow);min-width:0;max-width:100%;box-sizing:border-box}
.chip h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:17px;line-height:1.25;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip p{margin:2px 0 0;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{pointer-events:auto;font:700 12px/1 var(--font-body);color:var(--ink);background:var(--glass);border-radius:999px;padding:7px 11px;box-shadow:var(--shadow);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#B9C4D0}
.badge[data-st="on"]::before{background:var(--green)}
.badge[data-st="wake"]::before,.badge[data-st="wait"]::before{background:#F2B544}
.badge[data-st="off"]::before,.badge[data-st="full"]::before{background:var(--red)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto;flex:0 0 auto}
.pill{appearance:none;border:0;border-radius:999px;padding:10px 16px;font:700 14px/1.1 var(--font-body);color:var(--ink);background:var(--paper);box-shadow:var(--shadow);cursor:pointer;white-space:nowrap}
.pill.primary{background:var(--blue);color:var(--paper)}
.pill:disabled{opacity:.45;cursor:default}
.pill:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);transform:translateX(-50%);max-width:calc(100vw - 32px);box-sizing:border-box;background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;text-align:center;z-index:6;box-shadow:var(--shadow);pointer-events:none}
.toast small{font-weight:500;opacity:.75;margin-left:8px;font-size:12px}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--glass);border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap;z-index:4;transition:opacity .6s;pointer-events:none;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(420px,calc(100vw - 32px));box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:20px;padding:14px 14px 14px 18px;box-shadow:0 10px 30px rgba(30,43,74,.22);z-index:7}
.card .t{flex:1;min-width:0}
.card .nm{font-family:var(--font-display);font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.card .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.tagp{display:inline-block;font-size:11px;font-weight:700;color:var(--red);border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 104px);width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);box-shadow:var(--shadow);touch-action:none;z-index:5}
.joy .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--paper);box-shadow:0 4px 12px rgba(30,43,74,.25)}
.stat{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font:600 12px/1 var(--font-body);color:var(--ink);background:var(--glass);padding:7px 10px;border-radius:10px;z-index:4;font-variant-numeric:tabular-nums}
.sheet{position:fixed;z-index:9;background:var(--paper);box-shadow:0 -8px 30px rgba(30,43,74,.2);display:flex;flex-direction:column;left:0;right:0;bottom:0;max-height:72%;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{left:auto;right:16px;top:calc(env(safe-area-inset-top,0px) + 72px);bottom:16px;width:360px;max-height:none;border-radius:20px}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px 20px}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:21px}
.sheet .body{overflow:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.grp h3{margin:0 4px 6px;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--ink-2)}
.item{appearance:none;width:100%;text-align:left;border:0;background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font:inherit;color:var(--ink);cursor:pointer;margin-bottom:6px}
.item:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.item .nm{font-weight:700;font-size:15px;min-width:0}
.item .ct{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.item .open{font-size:11px;font-weight:700;color:var(--green);border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.note,.empty{margin:0 4px;font-size:12px;line-height:1.6;color:var(--ink-2)}
.foot{padding:4px 16px 16px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.foot .pill{background:var(--soft);box-shadow:none;font-weight:500;font-size:13px;color:var(--ink-2)}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(205,235,246,.82);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:16px;box-sizing:border-box}
.overlay .box{background:var(--paper);border-radius:24px;padding:28px 24px 22px;width:min(380px,100%);box-sizing:border-box;text-align:center;box-shadow:0 14px 40px rgba(30,43,74,.25)}
.overlay h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.25;text-wrap:balance}
.overlay .sub{margin-top:6px;color:var(--ink-2);font-size:13px}
.overlay p{margin:18px 0 22px;font-size:15px;line-height:1.6}
/* 이름 정하기 */
.namebox input{width:100%;box-sizing:border-box;margin:18px 0 12px;border:2px solid #D6DEEB;border-radius:14px;padding:12px 14px;font:700 17px/1.2 var(--font-body);color:var(--ink);text-align:center;outline:none}
.namebox input:focus{border-color:var(--blue)}
.namebox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.namebox .me{width:92px;height:92px;margin:4px auto 0;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-family:var(--font-display);font-size:13px;color:var(--ink-2)}
.namebox .me .dot{width:56px;height:56px;border-radius:50% 50% 42% 42%;position:relative;box-shadow:inset 0 -18px 0 var(--c-shirt);background:var(--c-skin)}
.namebox .me .dot::before{content:"";position:absolute;left:4px;right:4px;top:-4px;height:26px;border-radius:50% 50% 30% 30%;background:var(--c-hair)}
/* 팝업: 책·사진첩·TV */
.pop{z-index:12;background:rgba(30,43,74,.45);align-items:center}
.pop .pbox{position:relative;width:min(640px,100%);max-height:calc(100vh - 32px);box-sizing:border-box;overflow:auto;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.pop .close{position:absolute;right:12px;top:12px;z-index:2}
.book{background:var(--cream);padding:26px 22px 22px;display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:300px;border:10px solid #8C6A4F;border-radius:14px}
.book .pg{padding:18px 20px;position:relative}
.book .pg.l{border-right:2px solid rgba(140,106,79,.35);box-shadow:inset -18px 0 24px -20px rgba(0,0,0,.25)}
.book .pg.r{box-shadow:inset 18px 0 24px -20px rgba(0,0,0,.25)}
.book h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.2}
.book .sub{margin-top:8px;color:var(--ink-2);font-size:13px}
.book .text{font-size:14.5px;line-height:1.75;color:#2B3650}
.book .text p{margin:0 0 12px}
.book .stag{position:absolute;left:20px;bottom:14px;font-size:11px;font-weight:700;color:var(--red);border:1px solid currentColor;border-radius:999px;padding:2px 8px}
.book .deco{margin-top:22px;height:90px;border-radius:10px;background:linear-gradient(180deg,#9CD1F0 0%,#E8F4FB 55%,#6FA86B 55%,#4F8A57 100%);position:relative;overflow:hidden}
.book .deco::after{content:"";position:absolute;left:30%;right:30%;bottom:40%;height:60px;border-radius:50% 50% 0 0;background:#577E5B}
.book .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(140,106,79,.4)}
.book .links .lh{width:100%;font-size:12px;font-weight:700;color:var(--ink-2)}
.book .links a{font-size:13px;font-weight:700;color:var(--blue);background:#fff;border-radius:999px;padding:7px 13px;text-decoration:none;box-shadow:0 2px 6px rgba(30,43,74,.1)}
.card .web{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;white-space:nowrap}
.card .web::after{content:" ↗"}
@media (max-width:560px){.book{grid-template-columns:1fr;padding:18px 14px}.book .pg.l{border-right:0;border-bottom:2px solid rgba(140,106,79,.35);box-shadow:none}.book .pg.r{box-shadow:none}}
.album{background:#F4EBDD;padding:26px 22px 22px;border:10px solid #7A4E3A;border-radius:14px}
.album h2{margin:0 0 14px;font-family:var(--font-display);font-weight:400;font-size:24px;text-align:center}
.album .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.album .photo{margin:0;background:#FFFFFF;padding:10px 10px 28px;box-shadow:0 6px 14px rgba(0,0,0,.18);transform:rotate(var(--tilt,0deg));position:relative}
.album .photo::before{content:"";position:absolute;left:50%;top:-10px;width:56px;height:18px;margin-left:-28px;background:rgba(255,230,150,.75);transform:rotate(-3deg)}
.album .photo img,.album .photo .ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:3px}
.album .photo .ph{background:linear-gradient(135deg,#DCE9F5,#BFD5EA);display:grid;place-items:center;font-family:var(--font-display);font-size:28px;color:rgba(30,43,74,.35)}
.album figcaption{text-align:center;font-size:12.5px;color:var(--ink-2);margin-top:8px;font-family:var(--font-display)}
.album .note{text-align:center;margin-top:16px}
.tvbox{background:#1C1C22;padding:22px 18px 18px;border-radius:18px}
.tvbox h2{margin:0 0 12px;color:#fff;font-family:var(--font-display);font-weight:400;font-size:20px;text-align:center}
.tvbox .screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:6px solid #2E2E36}
.tvbox .screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tvbox .tvph{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#1C2740,#2E4A7A)}
.tvbox .play{width:0;height:0;border-left:34px solid #fff;border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:10px;opacity:.9}
.tvbox .note{color:rgba(255,255,255,.7);text-align:center;margin-top:12px}
.tvbox .stand{width:38%;height:10px;margin:10px auto 0;background:#2E2E36;border-radius:0 0 10px 10px}
/* 대화·회화 연습 */
.talk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(520px,calc(100vw - 24px));box-sizing:border-box;background:var(--paper);border-radius:22px;padding:16px 18px 16px;box-shadow:0 12px 36px rgba(30,43,74,.26);z-index:11;max-height:calc(100vh - 110px);overflow:auto}
.talk .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.talk .who{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.talk .prog{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.talk .line{font-family:var(--font-display);font-size:21px;line-height:1.35;margin:10px 0 4px;text-wrap:balance}
.talk .fb{font-size:13.5px;line-height:1.5;margin:8px 0 0;padding:9px 12px;border-radius:12px;background:var(--soft)}
.talk .fb.ok{background:#E6F5EC;color:#1E6B41}
.talk .fb.no{background:#FDECEA;color:#A33228}
.talk .ask{font-size:12.5px;color:var(--ink-2);margin:10px 0 4px}
.talk .btns{display:flex;flex-direction:column;gap:8px;margin-top:10px;justify-content:stretch}
.talk .btns .pill{width:100%;box-sizing:border-box;text-align:left;box-shadow:none;background:var(--soft)}
.talk .btns .pill.choice{font-weight:500;font-size:15px;padding:12px 16px}
.talk .btns .pill.choice::before{content:"○";margin-right:10px;color:var(--blue);font-weight:900}
.talk .btns .pill.primary{background:var(--blue);color:#fff;text-align:center}
.talk .tools{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.talk .tools .pill{box-shadow:none;background:var(--soft);font-size:12.5px;padding:7px 12px;font-weight:500;color:var(--ink-2)}
.fade{position:fixed;inset:0;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .22s;z-index:11}
.fade.on{opacity:1}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--sky);font-family:var(--font-display);font-size:20px;color:var(--ink);z-index:12;transition:opacity .4s;padding:16px;text-align:center}
@media (max-width:480px){.btns{flex-direction:column;align-items:flex-end}.toast{top:calc(env(safe-area-inset-top,0px) + 126px)}.chipwrap{max-width:58vw}}
@media (prefers-reduced-motion:reduce){.fade,.hint,.loading{transition:none}}
</style>

<div id="view"></div>
<div class="top">
  <div class="chipwrap"><div class="chip"><h1 id="title"></h1><p id="region"></p></div><span id="mpBadge" class="badge" hidden></span></div>
  <div class="btns"><button id="btnLobby" class="pill" type="button" hidden></button><button id="btnMap" class="pill" type="button"></button><button id="btnList" class="pill" type="button"></button></div>
</div>
<div id="toast" class="toast" hidden></div>
<div id="hint" class="hint"></div>
<div id="card" class="card" hidden>
  <div class="t"><div id="cardName" class="nm"></div><div class="sub"><span id="cardSub"></span><span id="cardPend" class="tagp" hidden></span><a id="cardWeb" class="web" target="_blank" rel="noopener noreferrer" hidden></a></div></div>
  <button id="btnEnter" class="pill primary" type="button"></button>
</div>
<div id="joy" class="joy" hidden><div id="knob" class="knob"></div></div>
<div id="stat" class="stat" hidden></div>
<div id="list" class="sheet" hidden role="dialog" aria-labelledby="listTitle">
  <header><h2 id="listTitle"></h2><button id="btnListClose" class="pill" type="button"></button></header>
  <div id="listBody" class="body"></div>
  <div class="foot"><button id="btnProfile" class="pill" type="button"></button><button id="btnBots" class="pill" type="button"></button></div>
</div>
<div id="enter" class="overlay" hidden role="dialog" aria-labelledby="enterName">
  <div class="box"><h2 id="enterName"></h2><div id="enterSub" class="sub"></div><p id="enterBody"></p><button id="btnBack" class="pill primary" type="button"></button></div>
</div>
<div id="nameBox" class="overlay" hidden role="dialog" aria-labelledby="nameTitle">
  <div class="box namebox"><h2 id="nameTitle"></h2><div id="nameMe" class="me"><div class="dot"></div></div><input id="nameIn" type="text" maxlength="12" autocomplete="nickname" enterkeyhint="go"><div class="row"><button id="nameLook" class="pill" type="button"></button><button id="nameGo" class="pill primary" type="button"></button></div></div>
</div>
<div id="pop" class="overlay pop" hidden role="dialog">
  <div class="pbox">
    <button id="popClose" class="pill close" type="button">닫기</button>
    <div id="popBook" class="book" hidden>
      <div class="pg l"><h2 id="bookTitle"></h2><div id="bookSub" class="sub"></div><div class="deco"></div><span id="bookTag" class="stag" hidden></span></div>
      <div class="pg r"><div id="bookText" class="text"></div><div id="bookLinks" class="links" hidden></div></div>
    </div>
    <div id="popAlbum" class="album" hidden><h2 id="albumTitle"></h2><div id="albumGrid" class="grid"></div><p id="albumNote" class="note"></p></div>
    <div id="popTv" class="tvbox" hidden><h2 id="tvTitle"></h2><div id="tvFrame" class="screen"></div><div class="stand"></div><p id="tvNote" class="note"></p></div>
  </div>
</div>
<div id="talk" class="talk" hidden role="dialog" aria-live="polite">
  <div class="hd"><span id="talkWho" class="who"></span><span id="talkProg" class="prog" hidden></span></div>
  <div id="talkLine" class="line"></div>
  <div id="talkFb" class="fb" hidden></div>
  <div id="talkAsk" class="ask" hidden></div>
  <div id="talkBtns" class="btns"></div>
  <div class="tools"><button id="talkListen" class="pill" type="button" hidden></button><button id="talkClose" class="pill" type="button"></button></div>
</div>
<div id="fade" class="fade"></div>
<div id="loading" class="loading"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="france-map.js" charset="utf-8"></script>
<script src="lobby.config.js" charset="utf-8"></script>
<script src="room.js" charset="utf-8"></script>
<script src="lobby.js" charset="utf-8"></script>

</body>
</html>
